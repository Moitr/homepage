name: Build and deploy Hexo

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Every 8 hours: 08:20, 16:20 and 00:20 Asia/Shanghai.
    - cron: "20 */8 * * *"

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize articles and notes
        run: pnpm content:sync:ci

      - name: Synchronize friend links
        run: pnpm links:sync

      - name: Update README content lists
        run: pnpm readme:update

      - name: Test on-chain publisher
        run: pnpm test

      - name: Commit synchronized content
        shell: bash
        run: |
          git add -A -- source/_posts .content-sync-map.json README.md
          if git diff --cached --quiet; then
            echo "Synchronized content is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: synchronize site data"
          git push origin HEAD:main

      - name: Build site
        run: |
          pnpm clean
          pnpm build

      - name: Publish articles and friend links to Polygon mainnet
        id: polygon
        shell: bash
        env:
          POLYGON_PRIVATE_KEY: ${{ secrets.POLYGON_PRIVATE_KEY }}
          POLYGON_RPC_URL: ${{ vars.POLYGON_RPC_URL }}
        run: |
          if [ -z "$POLYGON_PRIVATE_KEY" ]; then
            echo "::notice::Polygon publication skipped because POLYGON_PRIVATE_KEY is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm onchain:publish:articles
          pnpm onchain:publish:links
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild with on-chain metadata
        if: steps.polygon.outputs.configured == 'true'
        run: |
          pnpm clean
          pnpm build

      - name: Publish pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ./public
          force_orphan: true
